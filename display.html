<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Match Display</title>
<link rel="stylesheet" href="display.css">
</head>

<body>

<div class="scoreboard">

<div class="header">

<!-- HEIMTEAM -->

<div class="team">

<img id="homeLogo" class="teamLogo">

<div id="homeName" class="teamName"></div>

<div id="homeScore" class="score">0</div>

<div id="homePenalties"></div>

</div>

<!-- CENTER -->

<div class="center">

<div id="period" class="period">PERIOD 1</div>

<div id="timeoutDisplay" class="timeout"></div>

<div id="breakDisplay" class="timeout"></div>

<div id="clock" class="clock">20:00</div>

</div>

<!-- GASTTEAM -->

<div class="team">

<img id="awayLogo" class="teamLogo">

<div id="awayName" class="teamName"></div>

<div id="awayScore" class="score">0</div>

<div id="awayPenalties"></div>

</div>

</div>

</div>

<script src="display.js"></script>

</body>
</html>

<div class="clock" id="clock">20:00</div>

</div>

<div class="team away">

<img id="awayLogo" class="teamLogo">

<div class="teamName" id="awayName">Away</div>

<div class="score" id="awayScore">0</div>

<div class="powerplayBar" id="awayPowerplay"></div>

<div class="penalties" id="awayPenalties"></div>

</div>

</div>

</div>

<script src="display.js"></script>

</body>
</html>
