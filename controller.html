<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Match Controller</title>
<link rel="stylesheet" href="controller.css">
</head>

<body>

<!-- SETUP SCREEN -->

<div id="setupScreen" class="container">

<h1>Match Setup</h1>

<div class="box">

<label>Liga</label> <select id="leagueSelect"></select>

<label>Heimteam</label> <select id="homeTeamSelect"></select> <img id="homeLogoPreview" class="logoPreview">

<label>Gastteam</label> <select id="awayTeamSelect"></select> <img id="awayLogoPreview" class="logoPreview">

<button onclick="startMatch()">Spiel starten</button>

</div>

</div>

<!-- MATCH CONTROLLER -->

<div id="controllerScreen" class="container" style="display:none">

<h1>Match Controller</h1>

<div class="box">

<div class="clock" id="liveClock">20:00</div>

<div class="score" id="liveScore">0 : 0</div>

<div class="period">
Drittel <span id="periodDisplay">1</span>
</div>

<h3>Tore</h3>

<button onclick="score('home',1)">Tor +1 Heim</button> <button onclick="score('home',-1)">Tor -1 Heim</button>

<button onclick="score('away',1)">Tor +1 Gast</button> <button onclick="score('away',-1)">Tor -1 Gast</button>

<h3>Uhr</h3>

<button onclick="startClock()">Start</button> <button onclick="pauseClock()">Pause</button> <button onclick="resetClock()">Reset</button>

<h3>Drittel</h3>

<button onclick="changePeriod(1)">Drittel +</button> <button onclick="changePeriod(-1)">Drittel -</button>

<h3>Timeout</h3>

<button onclick="timeout('home')">Timeout Heim</button> <button onclick="timeout('away')">Timeout Gast</button> <button onclick="clearTimeout()">Timeout löschen</button>

<h3>Pausen</h3>

<button onclick="startBreak(600)">10min Pause</button> <button onclick="startBreak(120)">2min Pause</button> <button onclick="cancelBreak()">Pause abbrechen</button>

<h3>Strafen</h3>

<button onclick="showPenaltyForm('home')">+ Strafe Heim</button> <button onclick="showPenaltyForm('away')">+ Strafe Gast</button>

</div>

</div>

<!-- STRAFE POPUP -->

<div id="penaltyForm" class="popup" style="display:none">

<div class="box">

<h3>Strafe</h3>

Rückennummer

<input id="penaltyNumber">

Strafart

<select id="penaltyType">
<option value="2">2 Minuten</option>
<option value="4">2+2 Minuten</option>
<option value="10">10 Minuten</option>
<option value="match">Matchstrafe</option>
</select>

<button onclick="addPenalty()">Strafe starten</button>

<button onclick="closePenalty()">Abbrechen</button>

</div>

</div>

<script src="controller.js"></script>

</body>
</html>
